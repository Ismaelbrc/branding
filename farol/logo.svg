<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 375">

  <!--
    FAROL — Logo
    Conceito: a luz do farol é uma flor.
    Um elemento. Uma ideia.
    Lighthouse of Alexandria — forma geométrica limpa, três níveis.
    A chama substituída por uma flor de cinco pétalas.
  -->

  <!-- ════════════════════════════════════════ -->
  <!--           ESTRUTURA DO FAROL            -->
  <!-- ════════════════════════════════════════ -->

  <!-- PLATAFORMA BASE -->
  <rect x="60"  y="297" width="160" height="7"  fill="#143D6B" rx="1"/>
  <rect x="75"  y="288" width="130" height="9"  fill="#0D2B4E" rx="1"/>

  <!-- NÍVEL 1 — Base (mais largo) -->
  <rect x="90"  y="244" width="100" height="44" fill="#0D2B4E"/>

  <!-- Faixa divisória 1→2 -->
  <rect x="84"  y="238" width="112" height="6"  fill="#143D6B"/>

  <!-- NÍVEL 2 — Torre intermediária -->
  <rect x="106" y="178" width="68"  height="60" fill="#0D2B4E"/>

  <!-- Faixa divisória 2→3 -->
  <rect x="100" y="172" width="80"  height="6"  fill="#143D6B"/>

  <!-- NÍVEL 3 — Sala da lanterna -->
  <rect x="124" y="136" width="32"  height="36" fill="#0D2B4E"/>

  <!-- Telhado cônico da lanterna -->
  <polygon
    points="117,136  163,136  154,124  126,124"
    fill="#143D6B"/>

  <!-- ════════════════════════════════════════ -->
  <!--         FLOR — A LUZ DO FAROL          -->
  <!--   Centro: (140, 117)  Comprimento: 30  -->
  <!--   Pétala: bezier cúbico simétrico       -->
  <!-- ════════════════════════════════════════ -->

  <path d="M140,117 C131,108 136,93 140,87 C144,93 149,108 140,117Z"
        fill="#E8614A" transform="rotate(0,   140,117)"/>
  <path d="M140,117 C131,108 136,93 140,87 C144,93 149,108 140,117Z"
        fill="#E8614A" transform="rotate(72,  140,117)"/>
  <path d="M140,117 C131,108 136,93 140,87 C144,93 149,108 140,117Z"
        fill="#E8614A" transform="rotate(144, 140,117)"/>
  <path d="M140,117 C131,108 136,93 140,87 C144,93 149,108 140,117Z"
        fill="#E8614A" transform="rotate(216, 140,117)"/>
  <path d="M140,117 C131,108 136,93 140,87 C144,93 149,108 140,117Z"
        fill="#E8614A" transform="rotate(288, 140,117)"/>

  <!-- Centro da flor -->
  <circle cx="140" cy="117" r="10" fill="#D4A84B"/>
  <circle cx="140" cy="117" r="4.5" fill="#B8882A"/>

  <!-- ════════════════════════════════════════ -->
  <!--              WORDMARK                   -->
  <!-- ════════════════════════════════════════ -->

  <text
    x="140" y="334"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="44"
    font-weight="bold"
    fill="#0D2B4E"
    text-anchor="middle"
    letter-spacing="11">FAROL</text>

  <text
    x="140" y="354"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="9"
    fill="#143D6B"
    text-anchor="middle"
    letter-spacing="4"
    opacity="0.8">SEU NEGÓCIO, ILUMINADO</text>

</svg>
