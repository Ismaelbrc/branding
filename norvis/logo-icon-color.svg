<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60">

  <!--
    NORVIS — Ícone colorido
    Versão com acento em azul nórdico na pupila.
    Para uso digital, apps, avatares.
  -->

  <!-- Olho — outline navy -->
  <path d="M 5,30 C 20,10 60,10 75,30 C 60,50 20,50 5,30 Z"
        fill="none" stroke="#0D1B2A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Íris — navy -->
  <circle cx="40" cy="30" r="11" fill="none" stroke="#0D1B2A" stroke-width="3"/>

  <!-- Pupila — azul nórdico: o ponto de visão -->
  <circle cx="40" cy="30" r="4.5" fill="#3B6FD4"/>

</svg>
